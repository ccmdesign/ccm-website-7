[build]
  command = "npm run generate"
  publish = ".output/public"

[functions]
  directory = "netlify/functions"

# Canonical host is ccmdesign.ca. Every other hostname that serves this site
# 301s there so traffic (and Google Analytics) stops splitting across domains.
# Netlify already redirects www.ccmdesign.ca -> ccmdesign.ca because ccmdesign.ca
# is the primary domain; the rules below cover the remaining aliases.
[[redirects]]
  from = "https://ccm.design/*"
  to = "https://ccmdesign.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ccm.design/*"
  to = "https://ccmdesign.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ccmdesign.ca/*"
  to = "https://ccmdesign.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://ccm-website-v7.netlify.app/*"
  to = "https://ccmdesign.ca/:splat"
  status = 301
  force = true

# Static generate cannot negotiate Accept. This function serves text/markdown
# on the same URL browsers use for HTML, and a Markdown body on HTTP 404.
[[edge_functions]]
  function = "markdown-negotiate"
  path = "/*"
  excludedPath = ["/_nuxt/*", "/assets/*", "/.netlify/*"]

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/agent-instructions.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Content-Type-Options = "nosniff"
